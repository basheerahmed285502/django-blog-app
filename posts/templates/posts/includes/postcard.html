<!-- posts/includes/postcard.html -->
<div class="col">
    <div class="card h-100 shadow-sm border border-secondary border-opacity-25 rounded-3 overflow-hidden">
        <div class="row g-0 h-100 align-items-stretch">
            <!-- Column 1: Image Frame Section (Inline styles extracted to CSS classes) -->
            <div class="col-sm-4 bg-light d-flex align-items-center justify-content-center overflow-hidden position-relative postcard-img-frame">
                {% if post.post_image %}
                    <img src="{{ post.post_image.url }}"
                         class="img-fluid w-100 h-100 object-fit-cover position-absolute"
                         alt="{{ post.title }}">
                {% else %}
                    <!-- Secure Default Placeholder Icon layout -->
                    <div class="text-center text-muted p-3">
                        <svg xmlns="http://w3.org"
                             width="40"
                             height="40"
                             fill="currentColor"
                             class="bi bi-image text-secondary opacity-50 mb-1"
                             viewBox="0 0 16 16">
                            <path d="M6.002 5.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0" />
                            <path d="M2.002 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2h-12zm12 1a1 1 0 0 1 1 1v6.5l-3.777-1.947a.5.5 0 0 0-.577.093l-3.71 3.71-2.66-1.772a.5.5 0 0 0-.63.062L1.002 12V3a1 1 0 0 1 1-1h12z" />
                        </svg>
                        <!-- Used Bootstrap 'xsmall' fallback rules instead of manual inline pixels -->
                        <div class="small postcard-placeholder-text">No Image</div>
                    </div>
                {% endif %}
            </div>
            <!-- Column 2: Article Text Details -->
            <div class="col-sm-8 d-flex flex-column">
                <div class="card-body d-flex flex-column h-100 p-3">
                    <!-- Metadata Header -->
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-25 small px-2 py-1">
                            By {{ post.user.username }}
                        </span>
                        <!-- Replaced style="font-size: 12px;" with native Bootstrap 'small' class -->
                        <small class="text-muted small">{{ post.published_date|date:"M d, Y" }}</small>
                    </div>
                    <!-- Title & Content Truncation -->
                    <h5 class="card-title fw-bold text-dark line-clamp-1 mb-2">{{ post.title|title }}</h5>
                    <p class="card-text text-secondary small flex-grow-1 mb-3">{{ post.content|truncatewords:18 }}</p>
                    <!-- Action Link Element -->
                    <div class="mt-auto">
                        <a href="{% url 'post' post.id %}"
                           class="btn btn-dark btn-sm rounded-2 px-3 fw-semibold">Read Article</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
